name: Generate autonomous snake arena

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pillow

      - name: Simulate a new match
        run: python scripts/generate_snake_arena.py --output output/snake-arena.gif --seed ${{ github.run_id }}

      - name: Publish the new match
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/snake-arena.gif
          git diff --cached --quiet || git commit -m "chore: generate a new autonomous snake match"
          git push
