<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Dipesh's journey from curiosity to conviction</title>
  <desc id="desc">A route connecting origins, experiments, products, lived problems, Shuvmarg, Disha and an unknown future.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081926"/><stop offset="1" stop-color="#102E41"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#6BAFC8"/><stop offset=".55" stop-color="#F0D19D"/><stop offset="1" stop-color="#E9793E"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="10" y="10" width="980" height="280" rx="24" fill="url(#bg)"/>
  <g opacity=".15" stroke="#80A8B8"><path d="M10 80h980M10 150h980M10 220h980"/><path d="M130 10v280M300 10v280M470 10v280M640 10v280M810 10v280"/></g>
  <path d="M75 176C170 72 225 227 326 144S486 70 550 151s131 84 189-7 120-72 188-7" fill="none" stroke="#020B11" stroke-width="18" opacity=".55"/>
  <path id="r" d="M75 176C170 72 225 227 326 144S486 70 550 151s131 84 189-7 120-72 188-7" fill="none" stroke="url(#line)" stroke-width="10" stroke-linecap="round"/>
  <path d="M75 176C170 72 225 227 326 144S486 70 550 151s131 84 189-7 120-72 188-7" fill="none" stroke="#FFF5DD" stroke-width="2" stroke-dasharray="8 12" opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.5s" repeatCount="indefinite"/></path>
  <g font-family="ui-monospace, SFMono-Regular, monospace" text-anchor="middle">
    <g transform="translate(75 176)"><circle r="14" fill="#E9793E" stroke="#FFF0D0" stroke-width="5"/><text y="40" fill="#FFF0D7" font-size="14" font-weight="700">ORIGINS</text><text y="60" fill="#7895A3" font-size="11">learning</text></g>
    <g transform="translate(237 171)"><circle r="11" fill="#0E2B3D" stroke="#8BC6DA" stroke-width="5"/><text y="-31" fill="#FFF0D7" font-size="14" font-weight="700">EXPERIMENTS</text><text y="-14" fill="#7895A3" font-size="11">trying everything</text></g>
    <g transform="translate(397 103)"><circle r="11" fill="#0E2B3D" stroke="#B5D6DF" stroke-width="5"/><text y="38" fill="#FFF0D7" font-size="14" font-weight="700">PRODUCTS</text><text y="56" fill="#7895A3" font-size="11">seeking usefulness</text></g>
    <g transform="translate(550 151)"><circle r="12" fill="#0E2B3D" stroke="#F1D19E" stroke-width="5"/><text y="42" fill="#FFF0D7" font-size="14" font-weight="700">LIVED PROBLEM</text><text y="61" fill="#A58F70" font-size="11">the road became personal</text></g>
    <g transform="translate(708 172)"><circle r="16" fill="#E9793E" stroke="#FFF0D0" stroke-width="5" filter="url(#glow)"/><text y="-39" fill="#FFF0D7" font-size="15" font-weight="700">SHUVMARG</text><text y="-20" fill="#D4B98C" font-size="11">building conviction</text></g>
    <g transform="translate(821 97)"><circle r="11" fill="#65B8D5" stroke="#E8F7FC" stroke-width="5"/><text y="-31" fill="#FFF0D7" font-size="14" font-weight="700">DISHA</text><text y="-14" fill="#83A9B7" font-size="11">explaining ideas</text></g>
    <g transform="translate(927 137)"><circle r="18" fill="#F8D99F" opacity=".18" filter="url(#glow)"/><circle r="6" fill="#FFF2C9"/><text y="41" fill="#FFF0D7" font-size="14" font-weight="700">?</text><text y="59" fill="#7895A3" font-size="11">not committed</text></g>
  </g>
</svg>
