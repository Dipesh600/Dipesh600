<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Dipesh Chaudhary</title>
  <desc id="desc">Founder and engineer from Nepal, building Shuvmarg and Disha.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#061522"/><stop offset=".58" stop-color="#0D293D"/><stop offset="1" stop-color="#173D50"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F4D6A4"/><stop offset="1" stop-color="#E9793E"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#8CB3C4" stroke-opacity=".075"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="20" y="20" width="960" height="300" rx="26"/></clipPath>
  </defs>
  <rect x="20" y="20" width="960" height="300" rx="26" fill="url(#bg)"/>
  <rect x="20" y="20" width="960" height="300" rx="26" fill="url(#grid)"/>
  <g clip-path="url(#card)">
    <circle cx="900" cy="50" r="125" fill="#E9793E" opacity=".08"/>
    <circle cx="900" cy="50" r="78" fill="#F4D6A4" opacity=".05"/>
    <path d="M-10 310L150 190l103 89 128-142 132 139 126-104 129 119 136-154 158 123 84-65v155H-10z" fill="#0B2231"/>
    <path d="M-10 330L130 245l122 67 123-96 116 97 141-71 137 92 131-93 150 83 96-56v92H-10z" fill="#071A26"/>
    <path d="M642 348c72-73 82-137 157-168s122-49 177-117" fill="none" stroke="#07131C" stroke-width="22" opacity=".7"/>
    <path id="route" d="M642 348c72-73 82-137 157-168s122-49 177-117" fill="none" stroke="url(#road)" stroke-width="14" stroke-linecap="round"/>
    <path d="M642 348c72-73 82-137 157-168s122-49 177-117" fill="none" stroke="#FFF4D8" stroke-width="2" stroke-dasharray="9 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-42" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="78" y="83" fill="#7FC4DB" font-size="13" letter-spacing="4">HELLO FROM HARIPUR, NEPAL</text>
    <text x="76" y="148" fill="#FFF5E1" font-size="52" font-weight="800" letter-spacing="-2">DIPESH</text>
    <text x="76" y="201" fill="#FFF5E1" font-size="52" font-weight="800" letter-spacing="-2">CHAUDHARY</text>
    <rect x="76" y="224" width="8" height="22" rx="3" fill="#E9793E">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="98" y="241" fill="#D3E0E5" font-size="17">founder × engineer × still becoming</text>
    <text x="76" y="280" fill="#7895A3" font-size="13">CURRENT COORDINATES  →  SHUVMARG / DISHA / THE NEXT HARD PROBLEM</text>
  </g>
  <g transform="translate(804 155)" font-family="ui-monospace, monospace">
    <circle r="31" fill="#E9793E" opacity=".17" filter="url(#glow)"/>
    <circle r="10" fill="#FFB06F" stroke="#FFF0D1" stroke-width="4"/>
    <text x="-5" y="56" text-anchor="middle" fill="#F6D7A6" font-size="11" letter-spacing="2">YOU ARE HERE</text>
  </g>
  <rect x="20.75" y="20.75" width="958.5" height="298.5" rx="25.25" fill="none" stroke="#6D93A4" stroke-opacity=".3" stroke-width="1.5"/>
</svg>
